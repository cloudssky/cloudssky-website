<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" fill="none" aria-hidden="true">
<defs>
 <linearGradient id="body" x1="270" y1="90" x2="410" y2="312" gradientUnits="userSpaceOnUse">
  <stop stop-color="#6DCEEC" stop-opacity=".78"/>
  <stop offset=".21" stop-color="#2E95BF" stop-opacity=".88"/>
  <stop offset=".56" stop-color="#07547F" stop-opacity=".94"/>
  <stop offset=".88" stop-color="#073A62" stop-opacity=".94"/>
  <stop offset="1" stop-color="#0B567D" stop-opacity=".85"/>
 </linearGradient>
 <linearGradient id="belly" x1="300" y1="200" x2="400" y2="320" gradientUnits="userSpaceOnUse">
  <stop stop-color="#A0E3E9" stop-opacity=".69"/>
  <stop offset=".6" stop-color="#4AB9CC" stop-opacity=".6"/>
  <stop offset="1" stop-color="#156D97" stop-opacity=".2"/>
 </linearGradient>
 <linearGradient id="fin" x1="425" y1="212" x2="485" y2="350" gradientUnits="userSpaceOnUse">
  <stop stop-color="#4FBDE2" stop-opacity=".77"/>
  <stop offset="1" stop-color="#09466E" stop-opacity=".8"/>
 </linearGradient>
 <radialGradient id="rim"><stop stop-color="#67DEFA" stop-opacity=".36"/><stop offset="1" stop-color="#67DEFA" stop-opacity="0"/></radialGradient>
 <filter id="glimmer" x="-30%" y="-40%" width="160%" height="180%">
   <feGaussianBlur stdDeviation="8"/>
 </filter>
 <filter id="texture" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency=".024 .095" numOctaves="3" seed="7" result="noise"/>
   <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
   <feComponentTransfer in="gray" result="soft"><feFuncA type="linear" slope=".12"/></feComponentTransfer>
   <feBlend in="SourceGraphic" in2="soft" mode="screen"/>
 </filter>
</defs>
