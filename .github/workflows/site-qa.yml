name: Validate website pull request
on:
  pull_request:
    branches: [main]
    paths: ['de/**', 'en/**', 'assets/**', 'scripts/**', '.github/workflows/site-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify client script syntax
        run: node --check assets/site.js
      - name: Pre-render all localized routes
        run: node scripts/prerender.mjs
      - name: Verify site output and links
        run: node scripts/check-site.mjs
      - name: Package reviewable static site
        uses: actions/upload-artifact@v4
        with:
          name: clouds-sky-site-preview
          retention-days: 7
          path: |
            de/
            en/
            assets/
            public/
            branding/logo/
            index.html
            404.html
            robots.txt
            sitemap.xml
            .nojekyll
